<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dov'è la mia aula?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ln:#d9d6cc;--ac:#c2410c;--A:#c62828;--B:#2e7d32;--C:#1565c0;--D:#e0b400;--E:#ef6c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#f1efe8;--mut:#a3a199;--ln:#3a3935;--ac:#fb923c}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#f1efe8;--mut:#a3a199;--ln:#3a3935;--ac:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.sb{position:relative}
input{width:100%;padding:14px 16px;font-size:17px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus{outline:none;border-color:var(--ac)}
#res{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--ln);border-radius:12px;max-height:50vh;overflow:auto;z-index:5;display:none}
#res button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);font:inherit;cursor:pointer}
#res small{color:var(--mut)}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.map{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.msg{margin:12px 0;padding:14px;background:var(--card);border-left:5px solid var(--ac);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;font-size:14px;cursor:pointer}
.chips button.w{border-width:2px}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px}
@keyframes p{0%{r:8;opacity:1}100%{r:26;opacity:0}}
.pulse{animation:p 1.4s infinite}
.mw{position:relative}.map{max-height:78vh;overflow:auto;touch-action:pan-x pan-y}.zc{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}.zc button{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:22px;line-height:1;cursor:pointer;opacity:.92}
.zb{margin-top:8px;padding:8px 12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0;font-size:13px}.leg i{display:inline-block;width:14px;height:14px;border:1px solid #777;border-radius:3px;vertical-align:-2px;margin-right:4px}
.note{font-size:13px;color:var(--mut);margin-top:18px}
</style></head><body><main>
<h1>Dov'è la mia aula?</h1>
<div class="sb"><input id="q" type="search" placeholder="Cerca aula, laboratorio, ufficio… (es. 204, lettere 5, segreteria)" autocomplete="off"><div id="res"></div></div>
<div class="tabs" id="tabs"></div>
<div class="mw"><div class="map" id="mp"><svg id="svg" viewBox="0 0 900 720"></svg></div><div class="zc"><button onclick="setZ(zl*1.4)" aria-label="Ingrandisci">+</button><button onclick="setZ(zl/1.4)" aria-label="Riduci">−</button></div></div>
<div class="leg" id="leg"></div><div class="msg" id="msg">Cerca una stanza oppure sceglila dall'elenco qui sotto.</div>
<h2 id="lt">Sul piano</h2><div class="chips" id="chips"></div>
<p class="note">Pianta ricostruita dalle foto: forme e posizioni sono indicative. Vale la pianta ufficiale esposta a scuola.</p>
</main>
<script>
const FL=["Piano interrato","Piano rialzato","Piano primo","Piano secondo"];
const WING={A:{x:60,y:560,L:460,h:1,c:"var(--A)",d:"ala A (sud, lato ingresso principale)"},E:{x:540,y:560,L:280,h:1,c:"var(--E)",d:"ala E (sud-est)"},B:{x:70,y:180,L:380,h:0,c:"var(--B)",d:"ala B (ovest, verso la palestra)"},D:{x:600,y:150,L:410,h:0,c:"var(--D)",d:"ala D (est, il lungo corridoio centrale)"},C:{x:260,y:40,L:520,h:1,c:"var(--C)",d:"ala C (nord)"}};
// formato: Nome@posizione[@-]  (- = lato opposto: nord per A/E/C, ovest per B/D)
const R=[
{A:"Laboratorio legno@.05;Sala pesi@.3;Archivio biblioteca@.45;Debate - Biblioteca - Aula studio@.72",B:"Laboratorio modellato 2@.1;Centrale termica 1@.2;Cabina elettrica@.28;Magazzino 6@.4;Magazzino 7@.5;Palestra inferiore (spogliatoi alunni)@.95",C:"Discipline plastiche 3@.08;Laboratorio modellato 1@.3;Discipline plastiche 2@.08@-;Discipline plastiche 1@.35@-;Multimedia 1@.6@-;Forno cottura@.65;Discipline plastiche classi 4 e 5@.8@-;U.T.A.@.95@-",D:"Laboratorio topografia@.08;Aula riunioni@.45@-;Aula studio@.55;Servizi igienici@.05@-",E:"Atrio (ingresso piano interrato)@.1;Lab. tecnologico materiali@.2@-;Museo@.4;Archivio@.7;Archivio (2)@.9"},
{A:"Scienze / Chimica 1@.05;Inglese 4@.18;Inglese 3@.36;Inglese 2@.52;Aula punto compiti / sportello help@.68;Sala insegnanti@.88;Ufficio tecnico@.6@-;Sala stampa@.72@-;Aula inclusione@.48@-;Infermeria@.04@-",B:"Lab. comunicazione digitale@.12;Storia dell'arte 1@.28;Storia dell'arte 2@.43;Storia dell'arte 3@.58;Palestra superiore@.95",C:"Discipline pittoriche 1@.35@-;Scienze / Chimica 2@.3;Scienze / Chimica 3@.42;Lab. plastico digitale@.65;Religione 1@.65@-;Religione 2@.78@-;Infermeria (ala C)@.9@-;Aula blu@.9;Lettere 8@.97;Loggiato@.2@-",D:"Lettere 1 (1-2 AL ser)@.08;Lettere 2 (3 AL ser)@.22;Lettere 3 (4 AL ser)@.35;Lettere 4 (5 AL ser)@.46;Lettere 5@.6;Lettere 6@.74;Lettere 7@.88;Matematica 1 (3 AT ser)@.3@-;Matematica 2 (4 AT ser)@.43@-;Matematica 3 (5 AT ser)@.56@-;Matematica 4@.7@-;Aula rossa@.9@-",E:"Atrio ingresso principale@.12;Segreteria didattica@.3;Ufficio magazzino@.35@-;Staff@.5@-;Segreteria personale@.65@-;Ufficio D.S.G.A.@.45;Contabilità@.58;Dirigente scolastico@.93;Amministratore di rete@.9@-"},
{A:"Fisica 1@.05;Laboratorio lingue@.24;Discipline geometriche 3@.4;Scienze tecn. applicate 1@.55;Discipline geometriche 2@.7;Discipline geometriche 1@.86;Lab. geotecnica@.1@-;Smistamento 2@.45@-;Smistamento 1@.57@-;Attività alternative religione@.35@-",B:"Locale tecnici informatica@.08;Multimedia 3@.25;Tecnologie rappresentazione grafica@.4;Lab. informatica 1@.57",C:"Multimedia 2@.03;Lab. posa@.2@-;Storia dell'arte 4@.3@-;Scienze motorie 2@.4@-;Scienze motorie@.5@-;Filo/Storia/Ita 6@.1;Filo/Storia/Ita 5@.25;Filo/Storia/Ita 4@.38;Filo/Storia/Ita 3@.5;Discipline pittoriche 2@.66@-;Gipsoteca 1@.76;Discipline pittoriche 3@.9@-;Discipline pittoriche 4@.96",D:"Lettere 9@.07;Filo/Storia/Ita 1@.22;Filo/Storia/Ita 2@.37;Inglese 1@.5;Inglese 5@.64;Inglese 6@.77;Inglese 7@.9;Scienze tec. costruzioni 1@.35@-;Scienze tec. costruzioni 2@.5@-;Scienze tec. costruzioni 3@.65@-;Scienze tec. costruzioni 4@.8@-;Aula gialla@.93@-",E:"Atrio aula magna - area colloqui@.12;Aula Magna@.65"},
{A:"Chimica / Scienze 1@.05;Chimica / Scienze 2@.05@-;Aula 230/231@.25;Design 2@.4;Scienze tec. costruzioni 5@.55;Design 3@.7;Laboratorio modellazione 3D@.88",B:"Lab. informatica 3@.1;Lab. informatica 4@.25;Scienze tec. costruzioni 6@.5;Scienze tec. costruzioni 7@.65",C:"Design 1@.03;Architettura 2@.2@-;Aula 3-5@.34@-;Aula 3-6@.44@-;Fisica/Matematica 4@.12;Fisica/Matematica 3@.23;Fisica/Matematica 2@.34;Fisica/Matematica 1@.45;Architettura 1@.65@-;Discipline pittoriche 5@.88@-;Discipline pittoriche 6@.95",D:"Aula 201@.1;Aula 202@.22;Aula 203@.33;Aula 204@.44;Aula 205@.55;Aula 206@.66;Aula 206 bis@.8;Aula 212@.25@-;Aula 211@.38@-;Aula 210@.5@-;Aula 209@.63@-;Gipsoteca 2@.82@-",E:"Vuoto su aula magna@.5"}];
// Qui puoi collegare le classi alle aule, ad esempio: {"3B":"Aula 204"}
const CLASSI={};
const rooms=[];R.forEach((f,fi)=>Object.entries(f).forEach(([w,s])=>s.split(";").forEach(x=>{const p=x.split("@");rooms.push({n:p[0],f:fi,w,t:+p[1],s:p[2]=="-"?-1:1})})));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
Object.entries(CLASSI).forEach(([c,a])=>{const r=rooms.find(r=>norm(r.n)==norm(a));if(r)(r.cl=r.cl||[]).push(c)});
let fl=1,sel=null;
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const BIG={"Palestra superiore":[30,30,220,150],"Palestra inferiore (spogliatoi alunni)":[30,30,220,150],"Aula Magna":[680,560,140,104]};
const STAIRS=[[520,572,20,36],[178,300,24,40],[560,100,0,0]].filter(x=>x[2]);
const SUB=[[/motorie/i,"#9e9e9e","#111","Scienze motorie"],[/costruzioni/i,"#fb8c00","#111","Costruzioni"],[/pittoric|plastic|modellat|multimedia|inform|posa|^design|^architettura/i,"#ffffff","#111","Laboratori artistici/informatica"],[/chimica/i,"#43a047","#fff","Chimica / Scienze"],[/matematica|^fisica/i,"#4fc3f7","#111","Matematica / Fisica"],[/^inglese/i,"#1e56c8","#fff","Inglese"],[/storia dell'arte/i,"#8e44ad","#fff","Storia dell'arte"],[/^lettere|^filo/i,"#fdd835","#111","Lettere / Filo-Storia-Ita"],[/^religione/i,"#6d4c41","#fff","Religione"]];
function subj(r){if(/locale tecnici/i.test(r.n))return null;return SUB.find(x=>x[0].test(r.n))||null}
let zoom=false;
(function(){const g={};rooms.forEach(r=>{if(BIG[r.n]){r.rc=BIG[r.n];return}(g[r.f+r.w+r.s]=g[r.f+r.w+r.s]||[]).push(r)});
Object.values(g).forEach(a=>{a.sort((p,q)=>p.t-q.t);a.forEach((r,i)=>{const w=WING[r.w],L=w.L,pc=r.t*L,M=84;const l0=i?(pc+a[i-1].t*L)/2:0,h0=i<a.length-1?(pc+a[i+1].t*L)/2:L;const lo=Math.max(l0,pc-M/2,0),hi=Math.min(h0,pc+M/2,L),o=r.s>0?60:0;
r.rc=w.h?[w.x+lo,w.y+o,hi-lo,44]:[w.x+o,w.y+L-hi,44,hi-lo]})})})();
function desc(r){const tr=r.t<.34?"nel primo tratto":r.t<.67?"nella parte centrale":"in fondo";const v=r.w=="B"||r.w=="D";const lato=v?(r.s>0?"lato est":"lato ovest"):(r.s>0?"lato sud":"lato nord");
return `${FL[r.f]} · ${WING[r.w].d} · ${lato}, ${tr} del corridoio.`}
function label(r,tc){const[x,y,w,h]=r.rc,v=!WING[r.w].h&&!BIG[r.n],sp=v?h:w,cr=v?w:h,mc=Math.max(4,Math.floor(sp/5.2));let ls=[],c="";r.n.split(" ").forEach(t=>{if((c+" "+t).trim().length>mc&&c){ls.push(c);c=t}else c=(c+" "+t).trim()});ls.push(c);ls=ls.slice(0,Math.floor(cr/11)||1);
const cx=x+w/2,cy=y+h/2,n=ls.length;return `<text text-anchor="middle" font-size="${BIG[r.n]?14:9.5}" fill="${tc}" style="pointer-events:none"${v?` transform="rotate(-90 ${cx} ${cy})"`:""}>`+ls.map((l,i)=>`<tspan x="${cx}" y="${cy+(i-(n-1)/2)*11+3.5}">${l}</tspan>`).join("")+`</text>`}
function draw(){let h="";
if(fl>=2)h+=`<rect x="30" y="30" width="220" height="150" fill="none" stroke="var(--B)" stroke-width="2" stroke-dasharray="6 4"/><text x="140" y="108" text-anchor="middle" font-size="14" fill="var(--mut)">Vuoto su palestra</text>`;
for(const w of Object.values(WING)){const W=w.h?w.L:104,H=w.h?104:w.L;h+=`<rect x="${w.x}" y="${w.y}" width="${W}" height="${H}" fill="var(--card)" stroke="${w.c}" stroke-width="3"/>`+(w.h?`<rect x="${w.x}" y="${w.y+44}" width="${W}" height="16" fill="var(--bg)"/><text x="${w.x+W/2}" y="${w.y+56}" text-anchor="middle" font-size="9" fill="var(--mut)">CORRIDOIO</text>`:`<rect x="${w.x+44}" y="${w.y}" width="16" height="${H}" fill="var(--bg)"/>`)}
rooms.forEach((r,i)=>{if(r.f!=fl)return;const[x,y,w,hh]=r.rc,on=r==sel,sc=subj(r);h+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${on?"var(--ac)":sc?sc[1]:"var(--mut)"}" fill-opacity="${on?.7:sc?.85:.12}" stroke="${on?"var(--ac)":"#777"}" stroke-width="${on?3:1}" onclick="pick(${i})" style="cursor:pointer"/>`+label(r,on||!sc?"var(--tx)":sc[2])});
STAIRS.forEach(([x,y,w,hh])=>h+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#d9531e"/><text x="${x+w/2}" y="${y+hh/2+3}" font-size="7" fill="#fff" text-anchor="middle" transform="rotate(-90 ${x+w/2} ${y+hh/2})">SCALA</text>`);
[["A",290,705],["B",38,400],["C",520,22],["D",765,350],["E",800,705]].forEach(([k,x,y])=>h+=`<circle cx="${x}" cy="${y}" r="16" fill="${WING[k].c}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">${k}</text>`);
const en=fl==1?[530,690,"Ingresso principale",0]:fl==0?[760,545,"Ingresso interrato",1]:null;
if(en){const[x,y,t,d]=en;h+=d?`<path d="M${x-10} ${y-16} L${x+10} ${y-16} L${x} ${y}Z" fill="var(--ac)"/><text x="${x}" y="${y-22}" text-anchor="middle" font-size="12" fill="var(--tx)">${t}</text>`:`<path d="M${x-10} ${y} L${x+10} ${y} L${x} ${y-16}Z" fill="var(--ac)"/><text x="${x}" y="${y+16}" text-anchor="middle" font-size="12" fill="var(--tx)">${t}</text>`}
let vb="0 0 900 720";
if(sel&&sel.f==fl){const[x,y,w,hh]=sel.rc,cx=x+w/2,cy=y+hh/2;h+=`<circle class="pulse" cx="${cx}" cy="${cy}" fill="var(--ac)"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--ac)" stroke="#fff" stroke-width="3"/>`;
if(false){const W=340,H=272;vb=`${Math.max(0,Math.min(900-W,cx-W/2))} ${Math.max(0,Math.min(720-H,cy-H/2))} ${W} ${H}`}}
$("svg").setAttribute("viewBox",vb);$("svg").innerHTML=h;
$("tabs").innerHTML=FL.map((n,i)=>`<button class="${i==fl?"on":""}" onclick="fl=${i};draw()">${n.replace("Piano ","")}</button>`).join("");
$("lt").textContent=FL[fl];
$("chips").innerHTML=rooms.map((r,i)=>[r,i]).filter(([r])=>r.f==fl).map(([r,i])=>`<button class="w" style="border-color:${subj(r)?subj(r)[1]:"var(--ln)"};border-width:3px" onclick="pick(${i})">${r.n}</button>`).join("");
$("msg").innerHTML=sel?`<b>${sel.n}${sel.cl?" ("+sel.cl.join(", ")+")":""}</b><br>${desc(sel)}${sel.f!=fl?"<br><small>Cambia piano per vederla sulla mappa.</small>":``}`:"Cerca una stanza, tocca un'aula sulla mappa o scegli dall'elenco."}
function pick(i){sel=rooms[i];fl=sel.f;$("res").style.display="none";$("q").value=sel.n;draw();scrollTo({top:0,behavior:"smooth"})}
$("q").addEventListener("input",e=>{const k=norm(e.target.value);const b=$("res");if(!k){b.style.display="none";return}
const m=rooms.map((r,i)=>[r,i]).filter(([r])=>norm(r.n).includes(k)||(r.cl||[]).some(c=>norm(c).includes(k))).slice(0,12);
b.innerHTML=m.length?m.map(([r,i])=>`<button onclick="pick(${i})"><span>${r.n}</span><small>${FL[r.f].replace("Piano ","")} · ala ${r.w}</small></button>`).join(""):`<div style="padding:12px;color:var(--mut)">Nessun risultato</div>`;b.style.display="block"});
$("leg").innerHTML=SUB.map(x=>`<span><i style="background:${x[1]}"></i>${x[3]}</span>`).join("");
let zl=1;const mp=$("mp");
function setZ(z,cx,cy){z=Math.max(1,Math.min(4,z));const r=mp.getBoundingClientRect();cx=cx==null?r.width/2:cx;cy=cy==null?r.height/2:cy;const fx=(mp.scrollLeft+cx)/mp.scrollWidth,fy=(mp.scrollTop+cy)/mp.scrollHeight;zl=z;$("svg").style.width=z*100+"%";mp.scrollLeft=fx*mp.scrollWidth-cx;mp.scrollTop=fy*mp.scrollHeight-cy}
let pd=0,pz=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
mp.addEventListener("touchstart",e=>{if(e.touches.length==2){pd=dist(e.touches);pz=zl}},{passive:true});
mp.addEventListener("touchmove",e=>{if(e.touches.length==2&&pd){e.preventDefault();const r=mp.getBoundingClientRect();setZ(pz*dist(e.touches)/pd,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top)}},{passive:false});
mp.addEventListener("touchend",()=>{pd=0});
mp.addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();const r=mp.getBoundingClientRect();setZ(zl*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
draw();
</script></body></html>
